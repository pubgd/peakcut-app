services:
  - type: web
    name: peakcut-app
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: PEAKCUT_ACCOUNTS
        value: "0"
      - key: PEAKCUT_HOST
        value: "0.0.0.0"
      - key: PEAKCUT_YT_PROXY
        value: "http://rdspxmkt-rotate:7k25nhp4u2sr@p.webshare.io:80"
      - key: PEAKCUT_AI_PROVIDER
        value: "gemini"
      - key: PEAKCUT_AI_MODELS
        value: "gemini-3.1-flash-lite"
      - key: PEAKCUT_FETCH_MODEL
        value: "0"
      - key: PEAKCUT_YT_OAUTH2
        value: "0"
      - key: PEAKCUT_AI_KEY
        sync: false
      - key: PEAKCUT_YT_COOKIES_TEXT
        sync: false
